<!doctype html>
<html lang="en">
  <head>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://unknownshad0.github.io/" />
    <meta property="og:title" content="John Mark Anunciado | Portfolio" />
    <meta property="og:description" content="Web developer portfolio of John Mark Anunciado." />
    <meta property="og:image" content="https://unknownshad0.github.io/jm.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="description" content="Web developer portfolio of John Mark Anunciado." />
    <meta name="theme-color" content="#f5f8f7" />
    <script>
      (() => {
        let savedTheme;

        try {
          savedTheme = localStorage.getItem('portfolio-theme');
        } catch {}

        const mode = ['light', 'dark'].includes(savedTheme) ? savedTheme : 'auto';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = mode === 'dark' || (mode === 'auto' && prefersDark);

        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#07110f' : '#f5f8f7';
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/jm.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>Anunciado Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
